name: parity

# v0.4.0 is prose-only. Check transition structure and labels, not JSON parity.
# Keep the workflow/check name stable for existing repository settings.
#
# Actions are pinned by commit SHA rather than by tag — this is a public
# standards repo and a moved tag is a supply-chain vector. Each SHA is the
# commit its `v4` tag resolved to on 2026-07-27; bump deliberately.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/check-transition.mjs
      - run: node --test scripts/check-transition.test.mjs
